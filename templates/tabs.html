<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#070b16">
<meta name="color-scheme" content="dark">
<title>Lynk · Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --bg:#070b16;--bg-2:#0d1526;--bg-3:#131d33;--fg:#e2e8f0;--fg-muted:#94a3b8;--fg-dim:#64748b;
  --line:rgba(148,163,184,.16);--line-2:rgba(148,163,184,.08);
  --accent:#38bdf8;--accent-2:#818cf8;--danger:#f87171;--warn:#f59e0b;--ok:#10b981;
  --grad:linear-gradient(135deg,#38bdf8,#818cf8);
  --t:.18s cubic-bezier(.4,0,.2,1);--t-bounce:.26s cubic-bezier(.34,1.36,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--fg);overflow:hidden;
  display:flex;flex-direction:column;height:100dvh;min-height:0;
  overscroll-behavior:none;touch-action:manipulation;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}

.progress{position:fixed;top:0;left:0;height:3px;width:0;background:var(--grad);
box-shadow:0 0 8px rgba(56,189,248,.7),0 0 16px rgba(56,189,248,.35);
z-index:999999;opacity:0;transition:width .25s ease,opacity .2s;pointer-events:none}
.progress.active{opacity:1}
.progress.complete{width:100%!important;opacity:1;transition:width .18s ease}
.progress.done{opacity:0;transition:opacity .35s ease}

.menu-bar{display:flex;align-items:center;gap:4px;flex-shrink:0;padding:0 8px;
background:var(--bg-2);border-bottom:1px solid var(--line);font-size:12px;color:var(--fg-muted);
height:calc(34px + var(--safe-t));padding-top:var(--safe-t);
padding-left:calc(8px + var(--safe-l));padding-right:calc(8px + var(--safe-r))}
.menu-brand{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--fg);margin-right:6px}
.menu-mark{width:20px;height:20px;border-radius:6px;background:var(--grad);
display:grid;place-items:center;color:#0b1220;font-size:10px;font-weight:800;flex-shrink:0}
.menu-item{padding:4px 8px;border-radius:6px;cursor:pointer;font-weight:500;
background:transparent;border:none;color:var(--fg-muted);font-family:inherit;font-size:12px;
transition:var(--t);flex-shrink:0}
.menu-item:hover{background:rgba(148,163,184,.1);color:var(--fg)}
.spacer{flex:1;min-width:4px}

.zoom-controls{display:flex;align-items:center;gap:1px;flex-shrink:0;margin-right:4px}
.zoom-btn{
  width:24px;height:24px;display:grid;place-items:center;
  border-radius:6px;border:none;background:transparent;
  color:var(--fg-muted);cursor:pointer;font-size:15px;font-family:inherit;
  padding:0;line-height:1;transition:var(--t);
  -webkit-tap-highlight-color:transparent;flex-shrink:0;
}
.zoom-btn:hover{background:rgba(148,163,184,.12);color:var(--fg)}
.zoom-btn:active{transform:scale(0.88)}
.zoom-btn.active{background:rgba(56,189,248,.15);color:var(--accent)}
.zoom-btn svg{display:block;width:14px;height:14px}
.zoom-level{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;
  color:var(--fg-dim);min-width:36px;text-align:center;
  cursor:pointer;padding:3px 4px;border-radius:5px;
  border:none;background:transparent;transition:var(--t);flex-shrink:0;
}
.zoom-level:hover{color:var(--fg);background:rgba(148,163,184,.1)}
.zoom-level:active{transform:scale(0.94)}

.desktop-toggle{display:none}
@media(max-width:640px){
  .desktop-toggle{display:grid}
}

.status-pill{display:inline-flex;align-items:center;gap:5px;
font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--fg-dim);flex-shrink:0}
.status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);
box-shadow:0 0 6px rgba(16,185,129,.5);flex-shrink:0}
.status-pill .dot.busy{background:var(--accent);animation:pulse 1s infinite}
.status-pill .dot.err{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.8)}}
.ws-badge{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--fg-dim)}

.tab-strip{display:flex;align-items:center;gap:4px;flex-shrink:0;padding:4px 8px;height:38px;
background:var(--bg-2);border-bottom:1px solid var(--line);
padding-left:calc(8px + var(--safe-l));padding-right:calc(8px + var(--safe-r));
overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tab-strip::-webkit-scrollbar{display:none}
.tabs-inline{display:flex;gap:4px;align-items:center}
.tab{display:flex;align-items:center;gap:6px;padding:0 4px 0 10px;height:30px;border-radius:9px;
color:var(--fg-muted);cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap;
border:1px solid transparent;max-width:220px;min-width:90px;transition:var(--t);
position:relative;user-select:none;flex-shrink:0;outline:none}
.tab:hover{background:rgba(148,163,184,.08);color:var(--fg)}
.tab.active{background:rgba(56,189,248,.12);color:var(--accent);border-color:rgba(56,189,248,.3)}
.tab .t-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1}
.tab .t-close{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;
color:var(--fg-dim);font-size:15px;cursor:pointer;position:relative;flex-shrink:0}
.tab .t-close:hover{background:rgba(248,113,113,.18);color:var(--danger)}
.tab.busy .t-close{color:transparent!important;pointer-events:none;font-size:0!important}
.tab.busy .t-close::before{content:'';position:absolute;top:50%;left:50%;width:12px;height:12px;
margin:-6px 0 0 -6px;border:1.8px solid rgba(56,189,248,.25);border-top-color:var(--accent);
border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.new-tab{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;
border:1px solid rgba(148,163,184,.2);background:transparent;color:var(--fg-muted);font-size:18px;
cursor:pointer;padding:0;flex-shrink:0}
.new-tab:hover{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.4);color:var(--accent)}

.url-bar{display:flex;align-items:center;gap:6px;flex-shrink:0;padding:6px 10px;height:48px;
background:var(--bg-2);border-bottom:1px solid var(--line);
padding-left:calc(10px + var(--safe-l));padding-right:calc(10px + var(--safe-r))}
.nav{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;
border:1px solid rgba(148,163,184,.2);background:transparent;color:var(--fg);cursor:pointer;font-size:15px}
.nav:hover:not(:disabled){background:rgba(148,163,184,.1)}
.nav:disabled{opacity:.35;cursor:not-allowed}
.url-box{position:relative;flex:1;min-width:0}
.url-box input{width:100%;padding:9px 40px 9px 32px;background:var(--bg);color:var(--fg);
border:1px solid rgba(148,163,184,.2);border-radius:9px;
font-family:'JetBrains Mono',monospace;font-size:12.5px;outline:none;transition:var(--t)}
.url-box input:focus{border-color:rgba(56,189,248,.55);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
.url-box .lock{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg-dim);
font-size:12px;pointer-events:none}
.url-box .lock.secure{color:var(--ok)}
.url-box .star{position:absolute;right:8px;top:50%;transform:translateY(-50%);
background:transparent;border:none;color:var(--fg-dim);cursor:pointer;font-size:14px;padding:2px 4px}
.url-box .star.on{color:var(--warn)}
.go-btn{padding:8px 16px;border-radius:9px;border:none;flex-shrink:0;background:var(--grad);
color:#0b1220;font-weight:700;cursor:pointer;font-family:inherit;font-size:12.5px;min-height:34px}

.stack{flex:1 1 auto;min-height:0;position:relative;background:#000;overflow:hidden}
.frame{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:none;
background:#fff;transform-origin:0 0;will-change:transform}
.frame.active{display:block}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
flex-direction:column;gap:14px;background:var(--bg);color:var(--fg-muted);text-align:center;
padding:24px;z-index:5}
.empty-ico{font-size:52px;opacity:.5}
.empty-title{font-size:15px;font-weight:600;color:var(--fg)}
.empty-hint{font-size:12.5px;max-width:460px;line-height:1.7}
kbd{display:inline-block;padding:2px 7px;background:rgba(148,163,184,.12);
border:1px solid rgba(148,163,184,.2);border-radius:4px;
font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--fg)}

.status-bar{display:flex;align-items:center;gap:12px;flex-shrink:0;padding:4px 12px;
height:calc(26px + var(--safe-b));padding-bottom:calc(4px + var(--safe-b));
padding-left:calc(12px + var(--safe-l));padding-right:calc(12px + var(--safe-r));
background:var(--bg-2);border-top:1px solid var(--line);font-size:11px;color:var(--fg-dim);
font-family:'JetBrains Mono',monospace;overflow:hidden}
.status-item{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
overflow:hidden;text-overflow:ellipsis;min-width:0}
.status-item.link{flex:1;min-width:0;color:var(--fg-muted)}

.drawer{position:fixed;top:0;bottom:0;width:min(760px,100vw);background:var(--bg-2);z-index:9000;
display:flex;flex-direction:column;box-shadow:-24px 0 60px -20px rgba(0,0,0,.75);
transition:transform var(--t-bounce);padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
.drawer.right{right:0;border-left:1px solid var(--line);transform:translateX(100%)}
.drawer.right.open{transform:translateX(0)}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;
border-bottom:1px solid var(--line);flex-shrink:0;
padding-left:calc(16px + var(--safe-l));padding-right:calc(16px + var(--safe-r));
background:linear-gradient(180deg,rgba(56,189,248,.06),transparent)}
.drawer-title{font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px;min-width:0}
.drawer-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drawer-title .mark{width:26px;height:26px;border-radius:8px;background:var(--grad);
display:grid;place-items:center;color:#0b1220;font-size:13px;font-weight:800;flex-shrink:0}
.drawer-close{background:rgba(148,163,184,.08);border:none;color:var(--fg-muted);width:32px;
height:32px;border-radius:8px;font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0}
.drawer-close:hover{background:rgba(248,113,113,.15);color:var(--danger)}
.drawer-body{flex:1;overflow-y:auto;padding:16px;font-size:13px;-webkit-overflow-scrolling:touch;
overscroll-behavior:contain;min-width:0;min-height:0}
#kitBody{padding:14px}

.console-list{font-family:'JetBrains Mono',monospace;font-size:11.5px;line-height:1.55;
background:#050a14;border-radius:9px;padding:6px;max-height:calc(100vh - 220px);
overflow-y:auto;border:1px solid var(--line-2)}
.console-row{display:flex;gap:10px;padding:6px 10px;border-radius:6px;border-left:2px solid transparent}
.console-row:hover{background:rgba(148,163,184,.06)}
.console-row .time{color:var(--fg-dim);flex-shrink:0;font-size:10.5px}
.console-row .lvl{flex-shrink:0;font-size:10.5px;width:32px;font-weight:700;text-transform:uppercase}
.console-row .msg{flex:1;min-width:0;color:var(--fg);white-space:pre-wrap;word-break:break-word}
.console-row.info .lvl{color:var(--accent)}
.console-row.log .lvl{color:var(--fg-muted)}
.console-row.warn{border-left-color:var(--warn)} .console-row.warn .lvl{color:var(--warn)}
.console-row.error{border-left-color:var(--danger)} .console-row.error .lvl{color:var(--danger)}
.console-row.net .lvl{color:var(--accent-2)} .console-row.net{background:rgba(129,140,248,.05)}
.console-row .src{color:var(--fg-dim);font-size:10.5px;margin-top:3px;word-break:break-all}
.console-toolbar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.console-filter{padding:4px 10px;border-radius:14px;background:rgba(148,163,184,.08);
color:var(--fg-muted);border:1px solid rgba(148,163,184,.15);cursor:pointer;font-weight:600;
font-size:10.5px;font-family:inherit}
.console-filter.active{background:rgba(56,189,248,.15);color:var(--accent);border-color:rgba(56,189,248,.4)}

.ctx{position:fixed;background:var(--bg-2);border:1px solid rgba(148,163,184,.22);
border-radius:10px;padding:5px;min-width:220px;box-shadow:0 30px 60px -10px rgba(0,0,0,.8);
z-index:99999;display:none;max-width:calc(100vw - 16px)}
.ctx.show{display:block}
.ctx-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;
color:var(--fg);font-size:13px;cursor:pointer;user-select:none}
.ctx-item:hover{background:rgba(56,189,248,.12);color:var(--accent)}
.ctx-item .shortcut{margin-left:auto;color:var(--fg-dim);font-family:'JetBrains Mono',monospace;font-size:10.5px}
.ctx-sep{height:1px;background:rgba(148,163,184,.14);margin:5px 4px}

.cmdk{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:9999;display:none;
align-items:flex-start;justify-content:center;padding:80px 16px 16px;backdrop-filter:blur(6px)}
.cmdk.show{display:flex}
.cmdk-box{background:var(--bg-2);border:1px solid rgba(148,163,184,.2);border-radius:14px;
padding:14px;width:100%;max-width:640px}
.cmdk-box input{width:100%;padding:12px 14px;background:var(--bg);color:var(--fg);
border:1px solid rgba(148,163,184,.2);border-radius:10px;font-family:inherit;font-size:14px;outline:none}
.cmdk-hint{margin-top:10px;font-size:11px;color:var(--fg-dim)}

.toast{position:fixed;bottom:calc(40px + var(--safe-b));left:50%;
transform:translateX(-50%) translateY(80px);background:var(--bg-2);
border:1px solid rgba(148,163,184,.22);color:var(--fg);padding:11px 18px;border-radius:10px;
font-size:12.5px;font-weight:600;box-shadow:0 20px 40px -12px rgba(0,0,0,.7);z-index:99998;
opacity:0;transition:transform var(--t-bounce),opacity .2s;pointer-events:none;
display:flex;align-items:center;gap:10px;max-width:calc(100vw - 24px)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.result-pre{padding:12px;background:#070b16;border-radius:9px;
font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.55;color:var(--fg);overflow:auto;
max-height:50vh;white-space:pre-wrap;word-break:break-word;border:1px solid var(--line-2)}
.result-msg{padding:12px;border-radius:9px;font-size:12.5px;line-height:1.5;margin-bottom:8px;
word-break:break-word}
.result-msg.ok{background:rgba(16,185,129,.1);border-left:3px solid var(--ok);color:var(--ok)}
.result-msg.warn{background:rgba(245,158,11,.1);border-left:3px solid var(--warn);color:var(--warn)}
.result-msg.err{background:rgba(248,113,113,.1);border-left:3px solid var(--danger);color:var(--danger)}
.result-msg.info{background:rgba(56,189,248,.1);border-left:3px solid var(--accent);color:var(--accent)}
.result-kv{padding:7px 11px;background:#070b16;border-radius:6px;margin-bottom:3px;
font-family:'JetBrains Mono',monospace;font-size:11.5px;display:flex;gap:12px;
align-items:flex-start;word-break:break-word}
.result-kv .k{color:var(--accent);font-weight:600;flex-shrink:0;min-width:80px}
.result-kv .v{color:var(--fg);flex:1;min-width:0;overflow-wrap:anywhere}
.result-list-item{padding:7px 11px;background:#070b16;border-radius:6px;margin-bottom:3px;
font-family:'JetBrains Mono',monospace;font-size:11.5px;display:flex;gap:10px;
align-items:center;word-break:break-word;min-width:0}
.result-list-item a{color:var(--accent);text-decoration:none;flex:1;overflow:hidden;text-overflow:ellipsis}
.result-list-item .badge{font-size:10px;padding:2px 8px;border-radius:5px;
background:rgba(56,189,248,.12);color:var(--accent);flex-shrink:0;font-weight:600}
.tree-dir{display:flex;align-items:center;gap:8px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid rgba(148,163,184,.25);
background:transparent;color:var(--fg);font-family:inherit;font-weight:600;font-size:12.5px;
cursor:pointer;min-height:36px;transition:var(--t)}
.btn:hover{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.45);color:var(--accent)}
.btn.small{padding:5px 10px;font-size:11px;min-height:28px;border-radius:7px}
.finding{padding:11px 13px;border-radius:9px;margin-bottom:6px;background:#070b16;border-left:3px solid var(--accent)}
.finding.critical{border-left-color:#dc2626;background:rgba(220,38,38,.05)}
.finding.high{border-left-color:var(--danger);background:rgba(248,113,113,.05)}
.finding.medium{border-left-color:var(--warn);background:rgba(245,158,11,.05)}
.finding.low{border-left-color:var(--accent);background:rgba(56,189,248,.05)}
.finding-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px;flex-wrap:wrap}
.finding-head .sev{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:5px;
text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.finding-head .sev.critical{background:rgba(220,38,38,.15);color:#dc2626}
.finding-head .sev.high{background:rgba(248,113,113,.15);color:var(--danger)}
.finding-head .sev.medium{background:rgba(245,158,11,.15);color:var(--warn)}
.finding-head .sev.low{background:rgba(56,189,248,.15);color:var(--accent)}
.finding-head .title{flex:1;font-weight:700;font-size:12.5px;line-height:1.35;min-width:0;
word-break:break-word}
.finding-evidence{padding:8px 10px;background:rgba(2,6,23,.6);border-radius:6px;
font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--fg-muted);word-break:break-word;
white-space:pre-wrap;margin:6px 0;border:1px solid var(--line-2);max-height:200px;overflow:auto}
.finding-desc{font-size:12px;color:var(--fg-muted);line-height:1.55;margin-bottom:6px}
.finding-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--fg-dim);
font-family:'JetBrains Mono',monospace}

.kit-cat{margin-bottom:14px;min-width:0}
.kit-cat-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
color:var(--fg-dim);margin-bottom:8px;padding:0 2px}
.kit-grid{display:grid;gap:8px;min-width:0;
grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr))}
.kit-tile{padding:11px;border-radius:10px;background:#070b16;
border:1px solid rgba(148,163,184,.1);cursor:pointer;transition:var(--t);
display:flex;flex-direction:column;gap:5px;text-align:left;font-family:inherit;color:inherit;
min-height:96px;min-width:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
.kit-tile:hover,.kit-tile:focus-visible{background:#0b1220;border-color:rgba(56,189,248,.35);outline:none}
.kit-tile:active{transform:scale(.985)}

@media(max-width:640px){
  .menu-brand span.brand-label{display:none}
  .menu-item{padding:4px 6px;font-size:11.5px}
  .tab{max-width:130px;min-width:70px;padding:0 3px 0 8px;font-size:11.5px;height:28px}
  .nav{width:32px;height:32px;font-size:14px}
  .drawer{width:100vw;border-left:none}
  .drawer-body{padding:12px}
  #kitBody{padding:10px}
  .finding-head .title{font-size:12px}
  .url-bar{gap:4px;padding:5px 8px;height:44px;
    padding-left:calc(8px + var(--safe-l));padding-right:calc(8px + var(--safe-r))}
  .url-box input{font-size:12px;padding:8px 34px 8px 28px}
}

@media(max-width:480px){
  #statusText,#wsBadge{display:none}
  .menu-bar{gap:2px;padding-left:calc(6px + var(--safe-l));padding-right:calc(6px + var(--safe-r))}
  .menu-item{padding:4px 5px;font-size:11px}
  .go-btn{padding:7px 12px;font-size:12px}
  .tab-strip{height:34px;padding:3px 6px;
    padding-left:calc(6px + var(--safe-l));padding-right:calc(6px + var(--safe-r))}
  .new-tab{width:28px;height:28px;font-size:16px}
  .status-bar{gap:8px;font-size:10px}
  .console-list{font-size:11px;padding:4px}
  .console-row{padding:5px 8px;gap:8px}
  .result-kv{flex-direction:column;gap:2px}
  .result-kv .k{min-width:0}
  .kit-grid{grid-template-columns:repeat(auto-fill,minmax(min(120px,100%),1fr));gap:6px}
  .kit-tile{padding:9px;min-height:86px}
  .cmdk{padding:40px 10px 10px}
  .ctx{min-width:180px}
}

@media(max-width:360px){
  .menu-item{padding:4px 4px;font-size:10.5px}
  .go-btn{display:none}
  .tab{min-width:60px;max-width:110px}
  .status-bar .status-item:nth-child(3){display:none}
  .kit-grid{grid-template-columns:1fr 1fr}
  .kit-tile{padding:8px;min-height:80px}
  .finding{padding:9px 10px}
  .finding-head{gap:6px}
  .result-list-item{padding:6px 9px;font-size:11px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style></head><body>

<div class="progress" id="progress"></div>

<div class="menu-bar">
  <div class="menu-brand"><div class="menu-mark">L</div><span class="brand-label">Lynk</span></div>
  <button class="menu-item" id="mFile">File</button>
  <button class="menu-item" id="mTools">Tools</button>
  <button class="menu-item" id="mConsole">Console</button>
  <button class="menu-item" id="mView">View</button>
  <button class="menu-item" id="mClone" title="Clone this page">⎘ Clone</button>
  <div class="spacer"></div>

  <div class="zoom-controls" role="group" aria-label="Zoom">
    <button class="zoom-btn" id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
    <button class="zoom-level" id="zoomLevel" title="Reset zoom">100%</button>
    <button class="zoom-btn" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
  </div>

  <button class="zoom-btn desktop-toggle" id="desktopToggle"
          title="Desktop view" aria-label="Toggle desktop view" aria-pressed="false">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="1" y="2" width="14" height="9" rx="1"/>
      <line x1="5" y1="14" x2="11" y2="14"/>
      <line x1="8" y1="11" x2="8" y2="14"/>
    </svg>
  </button>

  <span class="status-pill">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Ready</span>
    <span class="ws-badge" id="wsBadge">· WS —</span>
  </span>
</div>

<div class="tab-strip">
  <div class="tabs-inline" id="tabs"></div>
  <button class="new-tab" id="newTab" title="New tab (Ctrl+T)">+</button>
</div>

<div class="url-bar">
  <button class="nav" id="btnBack" title="Back" disabled>←</button>
  <button class="nav" id="btnFwd" title="Forward" disabled>→</button>
  <button class="nav" id="btnReload" title="Reload">⟳</button>
  <div class="url-box">
    <span class="lock" id="urlLock">⌕</span>
    <input id="urlInput" placeholder="Type a URL or search…" spellcheck="false"
           autocomplete="off" autocapitalize="off" inputmode="url">
    <button class="star" id="urlStar" title="Bookmark (Ctrl+D)">☆</button>
  </div>
  <button class="go-btn" id="btnGo">Go</button>
</div>

<div class="stack" id="stack">
  <div class="empty" id="empty">
    <div class="empty-ico">🌐</div>
    <div class="empty-title">No tabs open</div>
    <div class="empty-hint">
      <kbd>Ctrl</kbd>+<kbd>T</kbd> new tab ·
      <kbd>Ctrl</kbd>+<kbd>L</kbd> URL ·
      <kbd>Ctrl</kbd>+<kbd>`</kbd> console ·
      <kbd>Ctrl</kbd>+<kbd>B</kbd> toolkit ·
      <kbd>Ctrl</kbd>+<kbd>K</kbd> palette
    </div>
  </div>
</div>

<div class="status-bar">
  <span class="status-item" id="stTabs">0 tabs</span>
  <span class="status-item link" id="stLink"></span>
  <span class="status-item" id="stMeta"></span>
</div>

<aside class="drawer right" id="drawerConsole">
  <div class="drawer-header">
    <div class="drawer-title"><div class="mark">▸_</div><span>Console</span>
      <span id="consoleTotal" style="color:#64748b;font-weight:600;font-size:11.5px"></span></div>
    <div style="display:flex;gap:6px">
      <button id="consoleExport" style="padding:5px 10px;border-radius:8px;
        border:1px solid rgba(148,163,184,.2);background:transparent;color:#e2e8f0;
        cursor:pointer;font-family:inherit;font-size:11px">Export</button>
      <button id="consoleClear" style="padding:5px 10px;border-radius:8px;
        border:1px solid rgba(248,113,113,.35);background:transparent;color:#f87171;
        cursor:pointer;font-family:inherit;font-size:11px">Clear</button>
      <button class="drawer-close" id="consoleClose">✕</button>
    </div>
  </div>
  <div class="drawer-body">
    <div class="console-toolbar">
      <button class="console-filter active" data-lvl="all">All</button>
      <button class="console-filter" data-lvl="log">Log</button>
      <button class="console-filter" data-lvl="info">Info</button>
      <button class="console-filter" data-lvl="warn">Warn</button>
      <button class="console-filter" data-lvl="error">Error</button>
      <button class="console-filter" data-lvl="net">Network</button>
      <label style="margin-left:auto;font-size:11px;color:#94a3b8;display:flex;
        align-items:center;gap:5px;cursor:pointer">
        <input type="checkbox" id="consoleActiveTab" style="accent-color:#38bdf8">
        Only current tab
      </label>
    </div>
    <div class="console-list" id="consoleList">
      <div style="padding:40px 20px;text-align:center;color:#64748b">
        No messages yet.<br>Console output from proxied pages appears here.
      </div>
    </div>
  </div>
</aside>

<aside class="drawer right" id="drawerKit">
  <div class="drawer-header">
    <div class="drawer-title"><div class="mark">🛠</div><span>Offensive Toolkit</span></div>
    <button class="drawer-close" id="kitClose">✕</button>
  </div>
  <div class="drawer-body" id="kitBody"></div>
</aside>

<div class="ctx" id="ctxMenu"></div>

<div class="cmdk" id="cmdk">
  <div class="cmdk-box">
    <input id="cmdkInput" placeholder="Type a URL, or search…" autocomplete="off">
    <div class="cmdk-hint">
      <kbd>Enter</kbd> navigate · <kbd>Shift</kbd>+<kbd>Enter</kbd> new tab ·
      <kbd>Esc</kbd> close
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/lynkio/client.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/shell.js"></script>
<script src="/static/js/toolkit.js"></script>
</body></html>
